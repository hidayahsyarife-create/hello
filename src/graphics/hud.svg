<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- ============================================================
       NEON GENESIS — THE LAST SIGNAL
       graphics/hud.svg — futuristic HUD overlay layer.
       Vector-only, no external assets. Groups carry ids so the GSAP
       phase (Phase 5) can animate them by selector:
         #frame    corner brackets + letterbox accents
         #scanner  rotating scan reticle (animatable via rotation)
         #waveform signal wave (animatable via stroke-dashoffset)
         #readout  data ticks and hexadecimal telemetry lines
         #glyphs   sci-fi symbol clusters
       ============================================================ -->
  <defs>
    <linearGradient id="hudBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2a6fb8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="hudPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2d95" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="scanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#9fd8ff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#9fd8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- full-frame scan field: barely-visible grid -->
  <g id="gridfield" opacity="0.08">
    <path d="M0 135 H1920 M0 270 H1920 M0 405 H1920 M0 540 H1920 M0 675 H1920 M0 810 H1920 M0 945 H1920"
          stroke="#9fd8ff" stroke-width="1"/>
    <path d="M160 0 V1080 M320 0 V1080 M480 0 V1080 M640 0 V1080 M800 0 V1080 M960 0 V1080
             M1120 0 V1080 M1280 0 V1080 M1440 0 V1080 M1600 0 V1080 M1760 0 V1080"
          stroke="#9fd8ff" stroke-width="1"/>
  </g>

  <!-- reticle / scanner at frame center -->
  <g id="scanner" filter="url(#glowSoft)" transform="translate(960 540)">
    <circle r="210" fill="url(#scanGlow)"/>
    <circle r="180" fill="none" stroke="url(#hudBlue)" stroke-width="2"
            stroke-dasharray="8 14 2 14"/>
    <circle r="140" fill="none" stroke="#9fd8ff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- rotating sweep wedge -->
    <g id="scanner-sweep">
      <path d="M 0 0 L 180 0 A 180 180 0 0 0 127 -127 Z" fill="#9fd8ff" opacity="0.10"/>
      <line x1="0" y1="0" x2="180" y2="0" stroke="#9fd8ff" stroke-width="1.5"/>
    </g>
    <!-- tick ring -->
    <g id="scanner-ticks" stroke="#9fd8ff" stroke-opacity="0.8" stroke-width="2">
      <line x1="0" y1="-160" x2="0" y2="-172"/>
      <line x1="0" y1="160"  x2="0" y2="172"/>
      <line x1="-160" y1="0" x2="-172" y2="0"/>
      <line x1="160"  y1="0" x2="172"  y2="0"/>
      <line x1="-113" y1="-113" x2="-121" y2="-121"/>
      <line x1="113"  y1="113"  x2="121"  y2="121"/>
      <line x1="-113" y1="113"  x2="-121" y2="121"/>
      <line x1="113"  y1="-113" x2="121"  y2="-121"/>
    </g>
    <circle r="6" fill="#9fd8ff"/>
    <circle r="14" fill="none" stroke="#ff2d95" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- reticle target labels -->
  <g id="scanner-labels" filter="url(#glowSoft)"
     font-family="'Courier New', monospace" fill="#9fd8ff" opacity="0.85">
    <text x="1150" y="330" font-size="20" letter-spacing="6">ANOMALY-04</text>
    <text x="1150" y="356" font-size="14" opacity="0.7">SIGNATURE LOCK 94.2%</text>
    <line x1="1146" y1="322" x2="1105" y2="360" stroke="#9fd8ff" stroke-width="1.5"/>
    <text x="540" y="780" font-size="20" letter-spacing="6" text-anchor="end">TOWER GRID 7C</text>
    <text x="540" y="806" font-size="14" opacity="0.7" text-anchor="end">POWER 61% — FALLING</text>
    <line x1="544" y1="772" x2="590" y2="742" stroke="#9fd8ff" stroke-width="1.5"/>
  </g>

  <!-- corner brackets -->
  <g id="frame" stroke="url(#hudBlue)" stroke-width="4" fill="none" filter="url(#glow)">
    <path d="M 70 70 H 190 M 70 70 V 190"/>
    <path d="M 1850 70 H 1730 M 1850 70 V 190"/>
    <path d="M 70 1010 H 190 M 70 1010 V 890"/>
    <path d="M 1850 1010 H 1730 M 1850 1010 V 890"/>
  </g>

  <!-- waveform band, bottom-center -->
  <g id="waveform" filter="url(#glow)">
    <rect x="660" y="960" width="600" height="70" fill="#05070c" opacity="0.55"
          stroke="#2a4a6f" stroke-width="1"/>
    <polyline points="672,995 700,995 712,972 724,1015 736,984 748,1002 760,993
                      880,993 892,968 904,1014 916,985 928,998 940,992 1060,992
                      1072,975 1084,1008 1096,986 1108,1000 1120,993 1248,993"
              fill="none" stroke="#9fd8ff" stroke-width="2.5"/>
    <line x1="660" y1="960" x2="1260" y2="960" stroke="url(#hudPink)" stroke-width="2"/>
  </g>

  <!-- hexadecimal telemetry -->
  <g id="readout" font-family="'Courier New', monospace" fill="#9fd8ff"
     filter="url(#glowSoft)" opacity="0.8">
    <text x="720" y="80" font-size="17" letter-spacing="4">SIGNAL FREQ 128.709 MHz</text>
    <text x="720" y="102" font-size="17" letter-spacing="4" opacity="0.7">SRC: UNKNOWN — DZN-77 sector</text>
    <text x="1730" y="955" font-size="16" letter-spacing="2" text-anchor="end">0xA4 0x11 0xFE 0x2C 0xD9</text>
    <text x="1730" y="977" font-size="16" letter-spacing="2" text-anchor="end" opacity="0.7">0x77 0x09 0x3B 0xE1 0x48</text>
    <text x="720" y="955" font-size="16" letter-spacing="2">STATUS ▮▮▮▮▯▯▯▯ 48%</text>
    <text x="720" y="977" font-size="16" letter-spacing="2" opacity="0.7">DECODING…</text>
  </g>

  <!-- sci-fi glyph clusters -->
  <g id="glyphs" stroke="#9fd8ff" fill="none" stroke-width="2" filter="url(#glowSoft)">
    <g transform="translate(220 300)" opacity="0.75">
      <path d="M0 0 H28 L14 24 Z"/>
      <circle cx="14" cy="8" r="4"/>
    </g>
    <g transform="translate(240 360)" opacity="0.55">
      <rect width="22" height="22"/>
      <path d="M4 4 L18 18 M18 4 L4 18"/>
    </g>
    <g transform="translate(1660 260)" opacity="0.75">
      <circle r="14"/>
      <path d="M-14 0 H14 M0 -14 V14"/>
    </g>
    <g transform="translate(1690 320)" opacity="0.55">
      <path d="M0 0 H24 M0 8 H16 M0 16 H20"/>
    </g>
  </g>

  <!-- glitch streaks -->
  <g id="glitch" opacity="0.5">
    <rect x="420" y="480" width="240" height="3" fill="#ff2d95"/>
    <rect x="1180" y="620" width="180" height="2" fill="#9fd8ff" opacity="0.7"/>
    <rect x="820"  y="300" width="120" height="2" fill="#9fd8ff" opacity="0.5"/>
  </g>
</svg>
